[package]
name = "arcticfox-config"
version = "1.11.10"
description = "Configuration Tool for Vape Battery Mods with Arcticfox Firmware"
authors = ["Sebastian Raff"]
license = "GPL-3.0"
repository = "https://github.com/hobbyquaker/arcticfox-config"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arcticfox_config_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt", "macros"] }
log = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
